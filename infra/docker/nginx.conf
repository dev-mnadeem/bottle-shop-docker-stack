worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  log_format main '$remote_addr - $status $request_time "$request" upstream=$upstream_addr';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Two backend replicas. least_conn beats round-robin here because the cached
  # catalogue read and an uncached search differ by an order of magnitude, so
  # strict alternation can queue slow requests behind each other on one replica.
  upstream api {
    least_conn;
    server backend-1:4000 max_fails=3 fail_timeout=10s;
    server backend-2:4000 max_fails=3 fail_timeout=10s;
  }

  upstream web {
    server frontend:3000;
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  # The backend trusts exactly one proxy hop and reads the client address from
  # this header to key its rate limiter. Appending rather than overwriting keeps
  # an upstream load balancer's entry intact.
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_connect_timeout 3s;
  proxy_read_timeout    30s;

  server {
    listen 80;

    # Nginx's own liveness, answered without waking an upstream.
    location = /health {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    # Prometheus scrapes the backends directly (see prometheus.yml). Exposing
    # /metrics publicly here would publish process internals to the internet.
    location = /metrics {
      return 404;
    }

    location /api/ {
      proxy_pass http://api;
    }

    location = /docs      { proxy_pass http://api; }
    location /docs/       { proxy_pass http://api; }
    location = /openapi.json { proxy_pass http://api; }

    location / {
      proxy_pass http://web;
    }
  }
}
