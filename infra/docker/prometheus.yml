global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Scrape both API replicas directly. Pointing this at Nginx instead would
  # scrape whichever replica the proxy happened to pick and silently report one
  # replica's numbers as the whole service's.
  - job_name: eco-bottle-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-1:4000
          - backend-2:4000
